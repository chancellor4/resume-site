<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Title Strip</title>
<style>
  :root {
    --navy-base: #0A1535;
    --navy-top:  #13234F;
    --pink:      #FF3D8A;
    --yellow:    #F8E71C;
    --ease:      cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* Page is a stage; the strip is the subject. */
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #06091A;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
    color: #fff;
  }

  /* ---------- Strip shell ---------- */
  .strip {
    position: relative;
    width: 420px;
    max-width: calc(100vw - 32px);
    min-width: 320px;
    height: 88px;
    box-sizing: border-box;
    padding: 12px;
    border-radius: 14px;
    background: linear-gradient(to bottom, var(--navy-top), var(--navy-base));
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 14px;
    overflow: hidden;
  }

  /* ---------- Album art ---------- */
  .art {
    width: 64px;
    height: 64px;
    border-radius: 8px;
    background: #1a2a5a center/cover no-repeat;
    flex-shrink: 0;
  }

  /* ---------- Meta (title + artist) ---------- */
  .meta {
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
  }
  .title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .artist {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- Equalizer: pink means "this is happening" ---------- */
  .eq {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
    flex-shrink: 0;
  }
  .eq span {
    width: 2px;
    height: 30%;
    background: var(--pink);
    border-radius: 1px;
    transform-origin: bottom;
  }
  .strip[data-state="idle"] .eq      { visibility: hidden; }
  .strip[data-state="buffering"] .eq span { opacity: 0.4; }
  .strip[data-state="playing"] .eq span {
    animation: eq-bounce 900ms var(--ease) infinite;
  }
  .strip[data-state="playing"] .eq span:nth-child(2) { animation-delay: 120ms; }
  .strip[data-state="playing"] .eq span:nth-child(3) { animation-delay: 240ms; }
  .strip[data-state="playing"] .eq span:nth-child(4) { animation-delay: 360ms; }

  @keyframes eq-bounce {
    0%, 100% { height: 30%; }
    50%      { height: 100%; }
  }

  /* ---------- Controls: revealed on hover, never shift layout ---------- */
  .controls {
    display: flex;
    align-items: center;
    gap: 4px;
    opacity: 0;
    transition: opacity 120ms var(--ease);
    flex-shrink: 0;
  }
  .strip:hover .controls,
  .strip:focus-within .controls { opacity: 1; }

  .controls button {
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: rgba(255, 255, 255, 0.85);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background 120ms var(--ease);
  }
  .controls button:hover,
  .controls button:focus-visible {
    background: rgba(255, 255, 255, 0.08);
    outline: none;
  }
  .controls svg { width: 14px; height: 14px; fill: currentColor; }

  /* ---------- Progress: pink fill, yellow scrubber ---------- */
  .progress {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 2px;
    background: rgba(255, 255, 255, 0.06);
  }
  .progress-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    background: var(--pink);
    transition: width 250ms var(--ease), opacity 200ms var(--ease);
  }
  .progress-scrubber {
    position: absolute;
    bottom: 0;
    width: 1px;
    height: 8px;
    background: var(--yellow);
    box-shadow: 0 0 6px var(--yellow), 0 0 12px rgba(248, 231, 28, 0.4);
    opacity: 0;
    transition: left 250ms var(--ease), opacity 200ms var(--ease);
  }

  /* State: idle — no pink, no yellow. */
  .strip[data-state="idle"] .progress-fill     { opacity: 0; }
  .strip[data-state="idle"] .progress-scrubber { opacity: 0; }

  /* State: playing — yellow rides the leading edge. */
  .strip[data-state="playing"] .progress-scrubber { opacity: 1; }

  /* State: buffering — pink dims, yellow loops without progress. */
  .strip[data-state="buffering"] .progress-fill { opacity: 0.4; }
  .strip[data-state="buffering"] .progress-scrubber {
    animation: scrub-loop 1400ms var(--ease) infinite;
  }
  @keyframes scrub-loop {
    0%   { left: 0%;   opacity: 0; }
    20%  {             opacity: 1; }
    100% { left: 100%; opacity: 0; }
  }

  /* Respect motion preference — strip becomes still, still legible. */
  @media (prefers-reduced-motion: reduce) {
    .strip[data-state="playing"] .eq span,
    .strip[data-state="buffering"] .progress-scrubber {
      animation: none;
    }
    .strip[data-state="playing"] .eq span { height: 60%; }
  }
</style>
</head>
<body>

<div class="strip" data-state="idle" role="region" aria-label="Now playing">
  <div class="art" aria-hidden="true"></div>

  <div class="meta">
    <div class="title-row">
      <div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div class="title" aria-live="polite">Untitled</div>
    </div>
    <div class="artist">—</div>
  </div>

  <div class="controls">
    <button aria-label="Previous track" data-action="prev">
      <svg viewBox="0 0 16 16"><path d="M4 3v10h2V3H4zm3 5l7 5V3L7 8z"/></svg>
    </button>
    <button aria-label="Play or pause" data-action="play">
      <svg viewBox="0 0 16 16"><path d="M4 3l10 5L4 13V3z"/></svg>
    </button>
    <button aria-label="Next track" data-action="next">
      <svg viewBox="0 0 16 16"><path d="M10 3v10h2V3h-2zM2 3v10l7-5-7-5z"/></svg>
    </button>
  </div>

  <div class="progress" aria-hidden="true">
    <div class="progress-fill"></div>
    <div class="progress-scrubber"></div>
  </div>
</div>

<script>
/**
 * Title Strip — the seam between user and app.
 *   titleStrip.setTrack({ title, artist, art })   // strings + image url
 *   titleStrip.setState('idle' | 'playing' | 'buffering')
 *   titleStrip.setProgress(0..1)                  // clamped, safe to spam
 * Boring on purpose. Predictable on purpose.
 */
(() => {
  const root    = document.querySelector('.strip');
  const titleEl = root.querySelector('.title');
  const artistEl= root.querySelector('.artist');
  const artEl   = root.querySelector('.art');
  const fillEl  = root.querySelector('.progress-fill');
  const scrubEl = root.querySelector('.progress-scrubber');

  const VALID_STATES = new Set(['idle', 'playing', 'buffering']);

  window.titleStrip = {
    setTrack({ title = '', artist = '', art = '' } = {}) {
      titleEl.textContent  = title  || 'Untitled';
      artistEl.textContent = artist || '—';
      if (art) artEl.style.backgroundImage = `url("${art}")`;
    },
    setState(state) {
      if (!VALID_STATES.has(state)) return;
      root.dataset.state = state;
    },
    setProgress(p) {
      const v = Math.max(0, Math.min(1, p));
      fillEl.style.width = `${v * 100}%`;
      scrubEl.style.left = `calc(${v * 100}% - 1px)`;
    }
  };
})();

// ---- Demo wiring (delete when integrating) ----
titleStrip.setTrack({ title: 'Strobe', artist: 'deadmau5' });
titleStrip.setState('playing');
let p = 0.18;
setInterval(() => {
  p = (p + 0.004) % 1;
  titleStrip.setProgress(p);
}, 250);

// Cycle states so all three are visible during demo.
const cycle = ['playing', 'playing', 'buffering', 'playing', 'idle'];
let i = 0;
setInterval(() => {
  titleStrip.setState(cycle[i = (i + 1) % cycle.length]);
}, 5000);
</script>

</body>
</html>
