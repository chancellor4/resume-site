<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    about.html — compatibility redirect
    The About page has been folded back into the Fountain Clock (the
    landing room) and into Notes, where identity lives more naturally.
    Retained for inbound links and cached search results.
  -->

  <title>About moved — Chancellor Edwards</title>
  <meta name="description" content="The About page has moved to the Fountain Clock. Redirecting you now." />
  <meta name="robots" content="noindex, follow" />

  <!-- Canonical points to the new home: the Fountain Clock landing. -->
  <link rel="canonical" href="https://chancelloredwards.dev/" />

  <!-- No-JS fallback: meta refresh -->
  <meta http-equiv="refresh" content="0; url=index.html" />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico" />

  <!-- Minimal inline styling so the fallback view is still calm if JS is off -->
  <style>
    :root {
      --cream: #f8f4ee;  /* matches --page-bg in css/tokens.css */
      --ink:   #24180f;  /* matches --text-strong */
      --amber: #a06428;  /* warm accent — preserved from the early site */
    }
    html, body { margin: 0; padding: 0; background: var(--cream); color: var(--ink); }
    body {
      font-family: 'Lora', 'Georgia', serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
    }
    .stub-card { max-width: 28rem; }
    .stub-card h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.75rem; }
    .stub-card p  { margin: 0.5rem 0; color: var(--ink); opacity: 0.85; }
    .stub-card a  { color: var(--amber); text-decoration: none; border-bottom: 1px solid currentColor; }
    .stub-card a:hover { opacity: 0.75; }
  </style>
</head>
<body>
  <main class="stub-card" role="main">
    <h1>About has moved.</h1>
    <p>Identity now lives on the Fountain Clock.</p>
    <p>If nothing happens, <a href="index.html">open the Fountain Clock &rarr;</a></p>
  </main>

  <!--
    Fast, clean client-side redirect. Also fires when the SPA shell
    fetches this stub and runs its inline scripts; location.replace
    escapes the shell cleanly.
  -->
  <script>
    (function () {
      try {
        var suffix = (location.search || '') + (location.hash || '');
        location.replace('index.html' + suffix);
      } catch (e) {
        location.href = 'index.html';
      }
    })();
  </script>
</body>
</html>
