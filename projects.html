<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    projects.html — compatibility redirect
    Retained for inbound links and cached search results.
    The room that was here is now called the Playground: /playground.html
  -->

  <title>Projects moved to Playground — Chancellor Edwards</title>
  <meta name="description" content="The Projects page has moved to the Playground. Redirecting you now." />
  <meta name="robots" content="noindex, follow" />

  <!-- Canonical points to the new home -->
  <link rel="canonical" href="https://chancelloredwards.dev/playground.html" />

  <!-- No-JS fallback: meta refresh -->
  <meta http-equiv="refresh" content="0; url=playground.html" />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico" />

  <!-- Minimal inline styling so the fallback view is still calm if JS is off -->
  <style>
    :root {
      --cream: #f6f1e7;
      --ink:   #2a1a0a;
      --amber: #a06428;
    }
    html, body { margin: 0; padding: 0; background: var(--cream); color: var(--ink); }
    body {
      font-family: 'Lora', 'Georgia', serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
    }
    .stub-card { max-width: 28rem; }
    .stub-card h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.75rem; }
    .stub-card p  { margin: 0.5rem 0; color: var(--ink); opacity: 0.85; }
    .stub-card a  { color: var(--amber); text-decoration: none; border-bottom: 1px solid currentColor; }
    .stub-card a:hover { opacity: 0.75; }
  </style>
</head>
<body>
  <main class="stub-card" role="main">
    <h1>Projects is now the Playground.</h1>
    <p>Redirecting you there now.</p>
    <p>If nothing happens, <a href="playground.html">open the Playground &rarr;</a></p>
  </main>

  <!--
    Fast, clean client-side redirect.
    Also fires when the SPA shell fetches this stub and runs its inline
    scripts; location.replace escapes the shell cleanly, avoiding any
    flash of the stub content inside the app chrome.
  -->
  <script>
    (function () {
      try {
        // Preserve any query / hash the visitor arrived with.
        var suffix = (location.search || '') + (location.hash || '');
        location.replace('playground.html' + suffix);
      } catch (e) {
        location.href = 'playground.html';
      }
    })();
  </script>
</body>
</html>
